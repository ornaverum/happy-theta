# WishIMay: add inside the same `server { ... }` block as nginx-phys-api.conf,
# then: sudo nginx -t && sudo systemctl reload nginx
# The pages themselves are static: copy the contents of apps/wish/ into a `wish/` folder next to
# `phys/` in the site's web root, and they're served at https://your-domain/wish/ like phys/ is.
location /wish/api/ {
    proxy_pass http://127.0.0.1:3000;          # same Node service as /phys/api/; no trailing slash
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
    proxy_read_timeout 30s;                    # "Get details" reads a shop page (up to ~12 s)
}
