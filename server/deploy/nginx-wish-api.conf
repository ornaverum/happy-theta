# WishIMay: add inside the same `server { ... }` block as nginx-phys-api.conf,
# then: sudo nginx -t && sudo systemctl reload nginx
# The pages themselves are static (apps/wish/ in the web root), served at https://your-domain/apps/wish/.
location /apps/wish/api/ {
    proxy_pass http://127.0.0.1:3000;          # same Node service as /api/; no trailing slash
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
    proxy_read_timeout 30s;                    # "Get details" reads a shop page (up to ~12 s)
}
