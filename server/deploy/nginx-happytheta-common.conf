# Shared by physics., teacher. and apps.happytheta.com (see nginx-subdomains.conf).
# Install:  sudo cp deploy/nginx-happytheta-common.conf /etc/nginx/snippets/happytheta-common.conf
location /api/ {
    proxy_pass http://127.0.0.1:3000;          # no trailing slash: keeps the /api/ path
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4m;                   # saved work (a big course or map) can be a few MB
}
# Files every section uses; pages reach them as ../shared/… and ../branding/…
location /shared/   { alias /var/www/happytheta.com/public/shared/; }
location /branding/ { alias /var/www/happytheta.com/public/branding/; }
location ^~ /.well-known/ { allow all; }
location ~ /\. { deny all; }
