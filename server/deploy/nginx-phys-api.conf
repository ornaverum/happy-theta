# Add inside the existing `server { ... }` block for the site (the one whose web root holds
# index.html, apps/, teacher/, phys/, shared/, branding/), then: sudo nginx -t && sudo systemctl reload nginx
location /api/ {
    proxy_pass http://127.0.0.1:3000;          # no trailing slash: keeps the /api/ path
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4m;                   # saved work (a big course or map) can be a few MB
}
# The old address, still used by anything bookmarked or cached from before the site was split up.
location /phys/api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4m;
}
# Old WishIMay address → new one.
location = /wish { return 301 /apps/wish/; }
location /wish/ { rewrite ^/wish/(.*)$ /apps/wish/$1 permanent; }
