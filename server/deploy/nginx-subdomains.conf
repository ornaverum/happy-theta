# The live site, one subdomain per section. All four serve folders of the same web root
# (/var/www/happytheta.com/public, written by ~/deploy-happytheta.sh) and talk to the same Node service.
# Install:
#   sudo cp deploy/nginx-happytheta-common.conf /etc/nginx/snippets/happytheta-common.conf
#   sudo cp deploy/nginx-subdomains.conf /etc/nginx/sites-available/happytheta-subdomains.conf
#   sudo ln -s /etc/nginx/sites-available/happytheta-subdomains.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d physics.happytheta.com -d teacher.happytheta.com -d apps.happytheta.com -d wish.happytheta.com
# (certbot adds the HTTPS parts to this file itself.)

server {
    listen 80; listen [::]:80;
    server_name physics.happytheta.com;
    root /var/www/happytheta.com/public/phys;
    index index.html;
    include snippets/happytheta-common.conf;
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80; listen [::]:80;
    server_name teacher.happytheta.com;
    root /var/www/happytheta.com/public/teacher;
    index index.html;
    include snippets/happytheta-common.conf;
    # Teacher and Apps pages borrow the physics core script, styles and logo (../phys/js/core.js …)
    location /phys/js/     { alias /var/www/happytheta.com/public/phys/js/; }
    location /phys/css/    { alias /var/www/happytheta.com/public/phys/css/; }
    location /phys/assets/ { alias /var/www/happytheta.com/public/phys/assets/; }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80; listen [::]:80;
    server_name apps.happytheta.com;
    root /var/www/happytheta.com/public/apps;
    index index.html;
    include snippets/happytheta-common.conf;
    # Teacher and Apps pages borrow the physics core script, styles and logo (../phys/js/core.js …)
    location /phys/js/     { alias /var/www/happytheta.com/public/phys/js/; }
    location /phys/css/    { alias /var/www/happytheta.com/public/phys/css/; }
    location /phys/assets/ { alias /var/www/happytheta.com/public/phys/assets/; }
    # WishIMay has its own subdomain
    location ~ ^/wish(?:/(.*))?$ { return 301 https://wish.happytheta.com/$1$is_args$args; }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80; listen [::]:80;
    server_name wish.happytheta.com;
    root /var/www/happytheta.com/public/apps/wish;
    index index.html;
    # WishIMay's own API. The Node service keeps it at /wish/api/ (WISH_BASE_PATH=/wish in api.env;
    # it can't be /api/, that's the main API), so nginx maps the path and the cookie's Path.
    location /api/ {
        proxy_pass http://127.0.0.1:3000/wish/api/;
        proxy_cookie_path /wish /;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
        proxy_read_timeout 30s;                # "Get details" reads a shop page (up to ~12 s)
    }
    location ^~ /.well-known/ { allow all; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
