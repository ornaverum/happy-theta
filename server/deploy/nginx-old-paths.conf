# Old addresses on happytheta.com → the subdomains. Paste inside the `listen 443 ssl` server block of
# /etc/nginx/sites-available/happytheta.com.conf, near the top and outside any `location`. Keep this order
# (WishIMay before /apps). Then: sudo nginx -t && sudo systemctl reload nginx
# After this the old /api/ → /phys/api/, /apps/wish/api/ and /wish locations in that block can go.
rewrite ^/apps/wish(?:/(.*))?$ https://wish.happytheta.com/$1 permanent;
rewrite ^/wish(?:/(.*))?$      https://wish.happytheta.com/$1 permanent;
rewrite ^/phys(?:/(.*))?$      https://physics.happytheta.com/$1 permanent;
rewrite ^/teacher(?:/(.*))?$   https://teacher.happytheta.com/$1 permanent;
rewrite ^/apps(?:/(.*))?$      https://apps.happytheta.com/$1 permanent;
