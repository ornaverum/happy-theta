<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sign in · Happy Theta</title>
		<meta name="referrer" content="no-referrer" />
	</head>
	<body>
		<p>Taking you to the sign-in page…</p>
		<script>
			/* Signing in now happens on each section's dashboard (shared/gate.js). Pages that still send
			   people here (?next=/teacher/scheduler.html …) go to the matching dashboard, which comes back after. */
			(function () {
				var next = new URLSearchParams(location.search).get('next') || '';
				var ok = next.charAt(0) === '/' && next.charAt(1) !== '/' && next.indexOf('\\') < 0;
				var root = new URL('../../', location.href);
				var path = ok ? new URL(next, location.origin).pathname : '';
				var rel = path.indexOf(root.pathname) === 0 ? path.slice(root.pathname.length) : '';
				var dash = /^teacher\//.test(rel) ? 'teacher/' : /^apps\//.test(rel) ? 'apps/' : 'phys/';
				location.replace(new URL(dash, root).href + (ok ? '?next=' + encodeURIComponent(next) : ''));
			})();
		</script>
	</body>
</html>
