<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="referrer" content="no-referrer" />
		<title>Choose a new password · Happy Theta</title>
		<link rel="icon" href="../assets/favicon.png" />
		<link rel="stylesheet" href="../css/style.css" />
		<link rel="stylesheet" href="../css/account.css" />
	</head>
	<body data-root="../">
		<main class="acct-card">
			<h1>Choose a new password</h1>
			<p class="sub" id="intro">Checking your link…</p>
			<form id="reset-form" novalidate hidden>
				<input type="email" id="username" autocomplete="username" hidden />
				<label class="field">
					<span>New password</span>
					<input id="password" type="password" autocomplete="new-password" required minlength="8" maxlength="200" />
					<span class="hint">At least 8 characters.</span>
				</label>
				<label class="field">
					<span>Confirm new password</span>
					<input id="confirm" type="password" autocomplete="new-password" required maxlength="200" />
				</label>
				<button type="submit" class="btn btn-blue w-full" id="save">Save password</button>
			</form>
			<p class="status" id="status" role="status" aria-live="polite"></p>
			<p class="small back-link" id="links" hidden><a href="forgot.html">Get a new reset link</a> · <a href="login.html">Sign in</a></p>
		</main>
		<script src="../js/core.js"></script>
		<script src="../js/account.js"></script>
		<script src="../js/reset.js"></script>
	</body>
</html>
