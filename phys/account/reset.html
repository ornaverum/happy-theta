<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="referrer" content="no-referrer" />
		<title>New pass phrase · Happy Theta</title>
		<link rel="icon" href="../assets/favicon.png" />
		<link rel="stylesheet" href="../css/style.css" />
		<link rel="stylesheet" href="../css/account.css" />
	</head>
	<body data-root="../">
		<main class="acct-card">
			<h1>Get a new pass phrase</h1>
			<p class="sub" id="intro">Checking your link…</p>
			<form id="reset-form" novalidate hidden>
				<input type="email" id="username" autocomplete="username" hidden />
				<input id="password" type="password" autocomplete="new-password" hidden />
				<div class="field">
					<span>Your new pass phrase</span>
					<div class="phrase" id="phrase" aria-live="polite">Making one up…</div>
					<div class="btn-row">
						<button type="button" class="btn btn-alt" id="another">Another one</button>
						<button type="button" class="btn btn-alt" id="copy">Copy</button>
					</div>
					<span class="hint">The site makes it up for you. Type it in camelCase as shown, or with spaces; capitals don't matter.</span>
				</div>
				<label class="check-row"><input type="checkbox" id="saved" /> <span>I've written it down or saved it in my password manager.</span></label>
				<button type="submit" class="btn btn-blue w-full" id="save" disabled>Save pass phrase</button>
			</form>
			<p class="status" id="status" role="status" aria-live="polite"></p>
			<p class="small back-link" id="links" hidden><a href="forgot.html">Get a new reset link</a> · <a href="../../index.html">Sign in</a></p>
		</main>
		<script src="../js/core.js"></script>
		<script src="../js/account.js"></script>
		<script src="../js/reset.js"></script>
	</body>
</html>
