<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="referrer" content="no-referrer" />
		<title>Forgot password · Happy Theta</title>
		<link rel="icon" href="../assets/favicon.png" />
		<link rel="stylesheet" href="../css/style.css" />
		<link rel="stylesheet" href="../css/account.css" />
	</head>
	<body data-root="../">
		<main class="acct-card">
			<h1>Forgot your password?</h1>
			<p class="sub" id="intro">Enter the email you signed up with and we'll send you a link to choose a new password.</p>
			<form id="forgot-form" novalidate>
				<label class="field">
					<span>Email</span>
					<input id="email" type="email" autocomplete="email" required maxlength="254" />
				</label>
				<button type="submit" class="btn btn-blue w-full" id="send">Send reset link</button>
			</form>
			<p class="status" id="status" role="status" aria-live="polite"></p>
			<p class="small back-link"><a href="login.html">Back to sign in</a></p>
		</main>
		<script src="../js/core.js"></script>
		<script src="../js/account.js"></script>
		<script src="../js/forgot.js"></script>
	</body>
</html>
