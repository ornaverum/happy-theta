<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Maze</title>
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fbfcf7'/%3E%3Cpath d='M6 6h20v20M6 6v14h14' fill='none' stroke='%23123674' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='13' cy='13' r='3.5' fill='%23d9432b'/%3E%3C/svg%3E" />
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<main class="page">
			<header class="head">
				<div>
					<h1 class="title">Maze</h1>
					<p class="sub">Roll the marble to the flag in the top-left corner.</p>
				</div>
				<div class="stats">
					<span class="moves"><span id="moves">0</span> moves</span>
					<button type="button" class="btn" id="newBtn">New maze</button>
				</div>
			</header>

			<div class="board" id="board">
				<canvas id="gameCanvas" aria-label="Maze. Use the arrow keys to move." role="img"></canvas>
				<div class="win" id="win" hidden>
					<div class="win-card" role="status">
						<h2>You made it!</h2>
						<p id="winText"></p>
						<button type="button" class="btn btn-strong" id="againBtn">New maze</button>
					</div>
				</div>
			</div>

			<p class="keys">Move with the arrow keys or W A S D, or swipe on a touch screen.</p>
		</main>
		<script src="script.js"></script>
	</body>
</html>
